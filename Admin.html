<!DOCTYPE html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{margin:0;background:#f3f7fb;font:14px Arial,sans-serif;color:#152942}.head{background:#071a35;color:white;padding:22px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px}.wrap{max-width:1150px;margin:28px auto;padding:0 16px}.panel{background:white;border:1px solid #dce6f0;border-radius:14px;padding:22px;box-shadow:0 8px 28px #071a350c}.login{max-width:420px;margin:65px auto}.field{width:100%;padding:12px;border:1px solid #ccd8e5;border-radius:8px;box-sizing:border-box;margin:8px 0 14px}.btn{background:#1264b5;color:white;border:0;border-radius:8px;padding:11px 16px;font-weight:bold;cursor:pointer}.muted{color:#66788c}.toolbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;margin:18px 0}.toolbar input{max-width:360px;flex:1;padding:10px;border:1px solid #ccd8e5;border-radius:8px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:850px}th,td{text-align:left;padding:12px;border-bottom:1px solid #e6edf4;vertical-align:top}th{background:#f3f7fb;color:#334c66}select{padding:7px;border:1px solid #ccd8e5;border-radius:7px}.msg{margin-top:12px;color:#b02b2b}.count{display:inline-block;background:#e7f3fc;padding:8px 12px;border-radius:8px;font-weight:bold}
</style></head><body><div class="head"><b>BHARAT PROJECT CONNECT · ENQUIRY ADMIN</b><span>Private Dashboard</span></div><div class="wrap">
<div id="login" class="panel login"><h2>Admin Login</h2><p class="muted">Enter your configured dashboard password.</p><label>Admin password</label><input class="field" id="password" type="password" autocomplete="current-password"><button class="btn" onclick="login()">Sign in</button><div class="msg" id="loginmsg"></div></div>
<div id="dashboard" style="display:none"><div class="panel"><h2 style="margin-top:0">Enquiry Management</h2><p class="muted">Review enquiries and update their follow-up status.</p><span class="count" id="count">0 enquiries</span><div class="toolbar"><input id="search" placeholder="Search name, phone, service or city..." oninput="render()"><button class="btn" onclick="load()">Refresh enquiries</button></div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Contact</th><th>Service</th><th>Requirement</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div><div class="msg" id="dashmsg"></div></div></div></div>
<script>
let pwd="",items=[];
function login(){pwd=document.getElementById('password').value;document.getElementById('loginmsg').textContent="Checking...";google.script.run.withSuccessHandler(d=>{items=d;document.getElementById('login').style.display='none';document.getElementById('dashboard').style.display='block';render();}).withFailureHandler(e=>document.getElementById('loginmsg').textContent=e.message).getEnquiries(pwd);}
function load(){document.getElementById('dashmsg').textContent="Refreshing...";google.script.run.withSuccessHandler(d=>{items=d;render();document.getElementById('dashmsg').textContent="Updated.";}).withFailureHandler(e=>document.getElementById('dashmsg').textContent=e.message).getEnquiries(pwd);}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(){let q=document.getElementById('search').value.toLowerCase();let rows=items.filter(x=>(x.name+' '+x.phone+' '+x.service+' '+x.location+' '+x.organisation).toLowerCase().includes(q));document.getElementById('count').textContent=rows.length+' enquiries';document.getElementById('rows').innerHTML=rows.map(x=>`<tr><td>${esc(x.date)}</td><td><b>${esc(x.name)}</b><br>${esc(x.organisation)}<br><a href="tel:${esc(x.phone)}">${esc(x.phone)}</a><br>${esc(x.email)}</td><td>${esc(x.service)}<br><small>${esc(x.location)}</small></td><td>${esc(x.message)}</td><td><select onchange="changeStatus('${esc(x.id)}',this.value)">${['New','Contacted','In Progress','Converted','Closed'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan="5">No enquiries found.</td></tr>';}
function changeStatus(id,status){google.script.run.withSuccessHandler(()=>{let x=items.find(y=>y.id===id);if(x)x.status=status;document.getElementById('dashmsg').textContent='Status updated.';}).withFailureHandler(e=>document.getElementById('dashmsg').textContent=e.message).updateEnquiryStatus(id,status,pwd);}
</script></body></html>
